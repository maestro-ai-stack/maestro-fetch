name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --extra dev --extra pdf --extra data
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run python -m pytest -q
      - name: Compileall
        run: uv run python -m compileall src
      - name: Build package
        run: uv build
      - name: Twine metadata check
        run: uv tool run twine check dist/*
      - name: Repo hygiene scan
        run: uv run python scripts/check_repo_hygiene.py
      - name: Release artifact scan
        run: uv run python scripts/check_release_artifacts.py

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Build wheel
        run: uv build --wheel
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: CLI smoke
        run: mfetch --help
      - name: Import smoke
        run: python -c "import maestro_fetch; print(maestro_fetch.__file__)"

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build extension
        run: npm run build
